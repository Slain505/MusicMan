name: music_go
description: "Walk around the city, find drops, collect music."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  geolocator: ^14.0.0
  http: ^1.2.0
  just_audio: ^0.10.0
  latlong2: ^0.9.1
  music_go_core:
    path: ../core
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
